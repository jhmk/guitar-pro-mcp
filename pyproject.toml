[project]
name = "guitar-pro-mcp"
version = "3.0.0"
description = "Guitar Pro MCP Server - Full featured GP file manipulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pyguitarpro>=0.10",
]

[project.scripts]
guitar-pro-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
