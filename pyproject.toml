[project]
name = "guitar-pro-mcp"
version = "2.2.3"
description = "Guitar Pro MCP Server - 8 consolidated tools for fast LLM dispatch, tab import, pattern repeat, chord shortcuts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyguitarpro>=0.10",
    "mcp[cli]>=1.0",
]

[project.scripts]
guitar-pro-mcp = "src.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
